[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "truedoc"
version = "0.0.1"
description = "TrueDoc: convert any PDF into machine-readable OKF markdown + YAML frontmatter, optimised for meaning accuracy."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pymupdf>=1.24",
  "pdfplumber>=0.11",
  "pypdfium2>=4.30",
  "numpy>=1.26",
  "pillow>=10",
  "opencv-python-headless>=4.9",
  "onnxruntime>=1.17",
  "pyyaml>=6",
  "wordninja>=2",  # English word list for OCR layers that glue words together
  "pydantic>=2",
  "rapidfuzz>=3",
  "lxml>=5",
  "rich>=13",
  "typer>=0.12",
]

[project.optional-dependencies]
bench = ["huggingface_hub>=0.23", "fuzzysearch>=0.7", "pytest>=8"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
truedoc = "truedoc.cli:app"

[tool.setuptools.packages.find]
include = ["truedoc*"]

[tool.setuptools.package-data]
truedoc = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
